name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  code-quality: write
  pull-requests: read

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux Build, Run Tests, and Generate Coverage Data
    steps:
      - name: Check out repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm clang

      - name: Install coverage-analytics
        run: python3 -m pip install -e .

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate Project
        run: |
          cmake -S example -B build -DENABLE_COVERAGE=ON -DCOVERAGE_TOOL=llvm \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++

      - name: Build, Run Tests, and Generate Coverage
        run: cmake --build build --target generate_profile_data

  windows:
    runs-on: windows-latest
    name: Windows Run Tests
    steps:
      - name: Check out repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Install coverage-analytics
        run: python -m pip install -e .

      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  macos:
    runs-on: macos-latest
    name: MacOS Build, Run Tests, and Generate Coverage Data
    steps:
      - name: Check out repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Install coverage-analytics
        run: python3 -m pip install -e .

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate Project
        run: |
          cmake -G Xcode -S example -B build -DENABLE_COVERAGE=ON -DCOVERAGE_TOOL=llvm

      - name: Build, Run Tests, and Generate Coverage
        run: cmake --build build --config Debug --target generate_profile_data

      - name: Upload Pages site
        uses: actions/upload-artifact@main
        with:
          name: coverage-website
          path: website
          if-no-files-found: error

      - name: Analyze PR coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          coverage-analytics diff "$BASE_SHA...HEAD" \
            --coverage build/coverage_example_output \
            --include 'example/*.cpp' --include 'example/*.hpp' \
            --format json > diff-coverage.json

      - name: Upload diff coverage findings
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@main
        with:
          name: diff-coverage
          path: diff-coverage.json
          if-no-files-found: error

      - name: Enforce PR coverage from JSON
        if: github.event_name == 'pull_request'
        run: coverage-analytics gate diff-coverage.json

  deploy-pages:
    name: Deploy Pages
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ steps.preview.outputs.url-path }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Download coverage website
        uses: actions/download-artifact@main
        with:
          name: coverage-website
          path: coverage-website

      - name: Include example sources in coverage website
        run: |
          cp -R example coverage-website/example
          jq '.source_root = "./"' coverage-website/data/files.json > coverage-website/data/files.json.tmp
          mv coverage-website/data/files.json.tmp coverage-website/data/files.json

      - name: Select preview URL
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
            echo "url-path=" >> "$GITHUB_OUTPUT"
          else
            echo "directory=pr/$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "url-path=pr/$PR_NUMBER/" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve coverage sites
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: coverage-website
          target-folder: ${{ steps.preview.outputs.directory }}
          clean-exclude: |
            pr/

      - name: Check out all published sites
        uses: actions/checkout@main
        with:
          ref: gh-pages
          path: pages-site

      - name: Configure Pages
        uses: actions/configure-pages@main

      - name: Upload all Pages sites
        uses: actions/upload-pages-artifact@main
        with:
          path: pages-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@main

      - name: Report Coverage Report URL
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          PREVIEW_PATH: ${{ steps.preview.outputs.url-path }}
        run: |
          printf '### Coverage preview\n\n%s%s\n' \
            "${SITE_URL%/}/" "$PREVIEW_PATH" >> "$GITHUB_STEP_SUMMARY"