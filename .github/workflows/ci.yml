name: Build and run tests

on: [push, pull_request]

permissions:
  contents: read
  code-quality: write
  pull-requests: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure build
        run: |
          cmake -G Xcode -S example -B build \
            -DENABLE_COVERAGE=ON \
            -DCOVERAGE_TOOL=llvm

      - name: Build, run tests, and generate coverage
        run: cmake --build build --config Debug --target generate_profile_data

