name: Build and run tests

on: [push, pull_request]

permissions:
  contents: read
  code-quality: write
  pull-requests: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure build
        run: |
          cmake -G Xcode -S example -B build \
            -DENABLE_COVERAGE=ON \
            -DCOVERAGE_TOOL=llvm

      - name: Build, run tests, and generate coverage
        run: cmake --build build --config Debug --target generate_profile_data

      - name: Upload coverage report of sample1_unittest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: build/sample1_unittest_output/coverage.xml
          language: cpp
          label: coverage
          fail-on-error: false

      - name: Upload coverage report of sample2_unittest
